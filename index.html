<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vortx Cloud — Digital Solution For Your Needs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='170 310 390 300'%3E%3Cpath fill='%232f8cff' d='M192 518 L218 410 C228 360 270 328 330 328 L543 328 L450 418 C440 428 428 433 410 433 L300 433 C275 433 258 442 240 460 Z M204 592 L300 498 L422 498 L346 576 C336 587 324 592 308 592 Z'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#030712;--card:#07101f;--b:#1d4ed8;--glow:#2f8cff;--t:#e8f1ff;--m:#8aa4c8}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 600px at 70% -10%,#0b2a63 0,transparent 60%),var(--bg);color:var(--t);font-family:system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh}
/* loader */
#loader{position:fixed;inset:0;z-index:99;background:#02050d;display:grid;place-content:center;justify-items:center;gap:22px;transition:opacity .8s,visibility .8s}
#loader.off{opacity:0;visibility:hidden}
.orb{width:110px;height:110px;position:relative}
.orb i{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:var(--glow);border-right-color:#0a4bd6;animation:spin 1.4s cubic-bezier(.6,.1,.3,.9) infinite;filter:drop-shadow(0 0 10px var(--glow))}
.orb i:nth-child(2){inset:14px;animation-duration:2s;animation-direction:reverse;border-top-color:#7fb8ff}
.orb b{position:absolute;inset:0;display:grid;place-content:center;font:800 34px system-ui;color:#fff;text-shadow:0 0 18px var(--glow);animation:pulse 1.8s ease-in-out infinite}
.lt{letter-spacing:.35em;font-weight:800;font-size:22px;animation:fadeUp 1s both}
.bar{width:220px;height:4px;background:#0c1b36;border-radius:9px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#1d4ed8,#6db3ff);box-shadow:0 0 12px var(--glow);animation:load 2.2s ease-in-out forwards}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes load{to{width:100%}}
@keyframes pulse{50%{transform:scale(1.08);opacity:.85}}@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
/* layout */
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 5vw;max-width:1200px;margin:auto}
header .logo{font-weight:800;letter-spacing:.12em;font-size:20px;cursor:pointer;text-shadow:0 0 14px var(--glow)}header .logo em{color:var(--glow);font-style:normal}
#bal{font-size:13px;font-weight:700;color:#9fd0ff;background:#071a3a;border:1px solid #14367a;border-radius:99px;padding:6px 14px;cursor:pointer}#bal:empty{display:none}
#dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:4px;padding:6px 8px 6px 4px;max-width:calc(100vw - 16px);background:#0a1020e6;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #1d3a7a;border-radius:99px;box-shadow:0 8px 32px #000a,0 0 24px #1d6bff33;touch-action:none;user-select:none;cursor:grab;transition:box-shadow .3s}
#dock.drag{cursor:grabbing;box-shadow:0 14px 44px #000c,0 0 34px #2f8cff77}
#grip{width:14px;height:28px;margin:0 2px 0 6px;background:radial-gradient(circle,#4d77c4 1.5px,transparent 2px) 0 0/7px 9px;opacity:.7}
#nav{display:flex;gap:2px;align-items:center}
.it{display:flex;align-items:center;gap:8px;height:44px;min-width:44px;justify-content:center;padding:0 12px;border-radius:99px;color:#a9bddf;cursor:pointer;transition:.3s;white-space:nowrap;font-size:13px;font-weight:600}
.it svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.it .lb{display:none}
.it:hover{color:#fff;background:#12306b}.it.on{color:#fff;background:linear-gradient(180deg,#2f8cff,#0a4bd6);box-shadow:0 0 16px #1d6bff88}.it.on .lb{display:inline}
@media(min-width:900px){.it .lb{display:inline}.it{padding:0 16px}}
@media(max-width:380px){.it{min-width:40px;padding:0 9px}}
main{padding:14px 5vw 120px;max-width:1200px;margin:auto}
.view{animation:in .6s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(18px)}}
h1{font-size:clamp(32px,6vw,58px);line-height:1.08;font-weight:800}h1 em{font-style:normal;background:linear-gradient(90deg,#2f8cff,#9fd0ff);-webkit-background-clip:text;color:transparent}
h2{margin:40px 0 16px;font-size:24px}p.s{color:var(--m);margin:14px 0 22px;max-width:560px;line-height:1.6}
.btn{border:0;cursor:pointer;color:#fff;font-weight:700;padding:12px 22px;border-radius:12px;background:linear-gradient(180deg,#2f8cff,#0a4bd6);box-shadow:0 0 18px #1d6bff66;transition:.3s;font-size:14px}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 28px #2f8cffaa}.btn.o{background:transparent;border:1px solid var(--b);box-shadow:none}.btn.sm{padding:8px 14px;font-size:12px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:linear-gradient(160deg,#081428,#050c18);border:1px solid #14367a;border-radius:16px;padding:20px;transition:.35s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-6px);border-color:var(--glow);box-shadow:0 0 30px #1d6bff44}
.card h3{font-size:30px}.card .pr{font-size:22px;font-weight:800;color:#6db3ff;margin:6px 0 12px}.card .pr small{font-size:12px;color:var(--m)}
.card li{list-style:none;color:var(--m);font-size:14px;padding:4px 0}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:34px}
.stats div{background:#07142b;border:1px solid #14367a;border-radius:14px;padding:16px;text-align:center}.stats b{font-size:24px;display:block;color:#6db3ff}
input,select{width:100%;background:#050d1c;border:1px solid #17408f;border-radius:10px;padding:12px;color:#fff;margin:6px 0 14px;outline:0;transition:.25s}input:focus{border-color:var(--glow);box-shadow:0 0 12px #2f8cff55}
label{font-size:13px;color:var(--m)}.box{max-width:420px;margin:30px auto}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px;border-bottom:1px solid #112a5c;text-align:left}th{color:var(--m)}
.tag{padding:3px 10px;border-radius:99px;font-size:11px;background:#0a2a66}.tag.approved{background:#0b5a2f}.tag.rejected{background:#6a1220}
.bal{font-size:34px;font-weight:800;color:#6db3ff}.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
#toast{position:fixed;bottom:96px;left:50%;transform:translate(-50%,80px);background:#0a1d44;border:1px solid var(--glow);padding:12px 20px;border-radius:12px;transition:.4s;z-index:50;opacity:0}
#toast.on{transform:translate(-50%,0);opacity:1}
.rv{opacity:0;transform:translateY(24px);transition:.7s cubic-bezier(.2,.8,.2,1)}.rv.on{opacity:1;transform:none}


/* ===== polish ===== */
body{-webkit-font-smoothing:antialiased;font-size:15px}::selection{background:#1d6bff88}
*{scrollbar-width:thin;scrollbar-color:#1d3a7a transparent}input,select{font-size:16px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(520px 320px at 8% 92%,#0a3a9a2e,transparent 70%),radial-gradient(420px 260px at 95% 40%,#2f8cff18,transparent 70%)}
h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}h2::before{content:"";width:4px;height:22px;border-radius:4px;background:linear-gradient(#2f8cff,#0a4bd6)}
.btn:active{transform:scale(.97)}tr:hover td{background:#0a1a3a55}.card{box-shadow:0 10px 30px #0006}
.card li{padding:5px 0}.grid{gap:18px}.stats div{transition:.3s}.stats div:hover{border-color:var(--glow);transform:translateY(-3px)}
/* ===== chat ===== */
.inchat header.top,.inchat #dock{display:none}.inchat main{padding:8px 8px 0;max-width:780px}
.chatwrap{display:flex;flex-direction:column;height:calc(100dvh - 16px);background:#070b16;border:1px solid #14367a;border-radius:20px;overflow:hidden}
.chead{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#0b1224;border-bottom:1px solid #12306b}.chead b{font-size:18px;flex:1}
.live{width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#111a30;color:#8fb6ff;cursor:pointer;flex:none;transition:.25s;font-size:20px}.ib:hover{background:#17306b;color:#fff}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.ib.send{background:#1f5fe0;color:#fff}
.rule{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#12122e;color:#a98bff;font-size:11px;letter-spacing:.1em;font-weight:700}
#cb{flex:1;overflow:auto;padding:8px 14px}
.msg{display:flex;gap:10px;margin:12px 0;animation:in .35s}.msg.me{justify-content:flex-end}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;margin-top:20px}
.mc{max-width:80%;display:flex;flex-direction:column;align-items:flex-start}.me .mc{align-items:flex-end}
.mm{display:flex;gap:8px;align-items:center;font-size:12px;margin-bottom:4px;color:var(--m);flex-wrap:wrap}.mm b{color:#c8d6f0}.bot .mm b{color:#ff5b4d}
.bdg{font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:99px;border:1px solid}.del{cursor:pointer;opacity:.6}
.bub{background:#1b2236;padding:10px 14px;border-radius:6px 18px 18px 18px;word-break:break-word;line-height:1.45;cursor:pointer;white-space:pre-wrap}
.me .bub{background:linear-gradient(180deg,#2f8cff,#0a4bd6);border-radius:18px 6px 18px 18px}.bot .bub{background:#2a1214;border:1px solid #5a1e22;cursor:default}
.quote{border-left:3px solid #8b5cf6;background:#0007;border-radius:8px;padding:5px 10px;margin-bottom:6px;font-size:12px;display:flex;flex-direction:column;white-space:normal}
.quote b{color:#b794ff}.quote span{opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.mt{color:#8ec5ff;font-weight:700}.me .mt{color:#fff;text-decoration:underline}
.rb{display:none;justify-content:space-between;align-items:center;padding:8px 14px;background:#0d1730;border-top:1px solid #12306b;font-size:13px;color:var(--m)}
.emo{display:none;flex-wrap:wrap;gap:2px;padding:8px 12px;background:#0b1224;border-top:1px solid #12306b}.emo a{font-size:22px;padding:4px 6px;cursor:pointer;border-radius:8px}.emo a:hover{background:#17306b}
.cin{display:flex;gap:10px;align-items:center;padding:10px 12px;background:#0b1224;border-top:1px solid #12306b}.cin input{margin:0;border-radius:99px;flex:1}

.mk{width:30px;height:24px;margin-right:9px;vertical-align:-5px;filter:drop-shadow(0 0 8px #2f8cff99)}
.tile{width:min(44vw,168px);aspect-ratio:4/5;border-radius:28px;background:var(--logo) center/cover;position:relative;overflow:hidden;box-shadow:0 0 0 1px #ffffff26,0 22px 60px #1d6bffaa;animation:tin 1.1s var(--ez) both,breathe 2.8s ease-in-out 1.1s infinite;will-change:transform,opacity}
.tile i{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff66 50%,transparent 70%);transform:translateX(-130%);animation:sheen 2.2s ease-in-out .9s infinite}
@keyframes tin{from{opacity:0;transform:scale(.78) translateY(18px);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
@keyframes tout{to{opacity:0;transform:scale(1.16);filter:blur(10px)}}
@keyframes breathe{50%{transform:scale(1.045);box-shadow:0 0 0 1px #ffffff33,0 26px 80px #2f8cffcc}}
@keyframes sheen{60%,100%{transform:translateX(130%)}}
#loader{transition:opacity .9s var(--ez),visibility .9s}#loader.off .tile{animation:tout .8s var(--ez) forwards}#loader .lt,#loader .bar{transition:opacity .5s}#loader.off .lt,#loader.off .bar{opacity:0}
#busy{position:fixed;inset:0;z-index:90;display:grid;place-content:center;justify-items:center;gap:16px;background:#02050dcc;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .4s var(--ez),visibility .4s}
#busy.on{opacity:1;visibility:visible}#busy .tile{width:92px;border-radius:20px}#bm{color:#cfe1ff;font-size:14px;letter-spacing:.04em;animation:fadeUp 1s both}
#pbar{position:fixed;top:0;left:0;height:3px;width:0;z-index:95;opacity:0;background:linear-gradient(90deg,#1d4ed8,#6db3ff);box-shadow:0 0 12px var(--glow);border-radius:0 3px 3px 0}
main{transition:opacity .22s var(--ez),transform .22s var(--ez)}main.out{opacity:0;transform:translateY(10px)}
.view{animation-duration:.7s;animation-timing-function:var(--ez)}.btn,.it,.card,.ib,input,select{transition-timing-function:var(--ez)}
#toast{transition:transform .5s var(--ez),opacity .4s var(--ez)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ===== avatar, story, akun ===== */
.hr{display:flex;gap:10px;align-items:center}#hav{display:flex;cursor:pointer}#hav .sav{width:36px;height:36px;font-size:15px;box-shadow:0 0 0 2px #1d4ed8}
.sav,.av{background-size:cover;background-position:center}.sav{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}.sav.sm{width:38px;height:38px}.sav.big{width:92px;height:92px;font-size:34px;box-shadow:0 0 0 3px #1d4ed8,0 0 24px #2f8cff66}
#srow{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 16px}#srow:empty{display:none}
.si{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--m);flex:none;width:72px;transition:transform .35s var(--ez)}.si:hover{transform:translateY(-3px)}
.ring{padding:3px;border-radius:50%;background:conic-gradient(#2fe3a0,#2f8cff,#2fe3a0)}.ring.none{background:#17306b}.ring .sav{border:3px solid #030712;box-sizing:content-box}
.plus{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:#2f8cff;color:#fff;font-style:normal;display:grid;place-items:center;font-weight:800;border:2px solid #030712}
.si span{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv{position:fixed;inset:0;z-index:70;background:#000;display:flex;align-items:center;animation:in .4s var(--ez)}
.sbars{display:flex;gap:4px;padding:12px;position:absolute;top:0;left:0;right:0;z-index:2}.sbars i{flex:1;height:3px;background:#ffffff40;border-radius:3px;overflow:hidden}.sbars b{display:block;height:100%;width:0;background:#fff}
.sh{position:absolute;top:28px;left:12px;display:flex;gap:10px;align-items:center;color:#fff;text-shadow:0 1px 6px #000;z-index:2}.sh small{display:block;opacity:.85}
.simg{width:100%;height:100%;object-fit:contain;animation:in .4s var(--ez)}.scap{position:absolute;bottom:0;left:0;right:0;padding:48px 18px calc(26px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000d);color:#fff;text-align:center}
.sx{position:absolute;top:24px;right:14px;color:#fff;font-size:22px;cursor:pointer;padding:6px;z-index:2}
.stc{aspect-ratio:3/4;border-radius:14px;background-size:cover;background-position:center;position:relative;border:1px solid #14367a}.stc a{position:absolute;top:6px;right:6px;background:#000a;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;cursor:pointer}.stc small{position:absolute;left:6px;bottom:6px;background:#000a;padding:2px 8px;border-radius:99px;font-size:11px}

 if(p=='/dashboard')await dashboard();else if(p=='/orders')await ordersPage();else if(p=='/chat')await chatPage();else if(p=='/account')await accountPage();else if(p=='/inbox')await inboxPage();else if(p.startsWith('/dm/'))await dmPage(p.slice(4));else if(p=='/admin')await admin();else app.innerHTML=(views[p]||views['/'])();reveal();app.classList.remove('out');prog(0);if(me&&(p=='/'||p=='/dashboard'))loadStories()}
addEventListener('hashchange',route);
(()=>{const d=document.getElementById('dock');let sx,sy,ox,oy,on=false;
 const put=(x,y)=>{const r=d.getBoundingClientRect();d.style.transform='none';d.style.bottom='auto';d.style.left=Math.min(Math.max(8,x),innerWidth-r.width-8)+'px';d.style.top=Math.min(Math.max(8,y),innerHeight-r.height-8)+'px'};
 try{const p=JSON.parse(localStorage.getItem('dockpos')||'null');if(p)put(p.x,p.y)}catch(e){}
 d.addEventListener('pointerdown',e=>{if(e.target.closest('.it'))return;const r=d.getBoundingClientRect();on=true;sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;d.setPointerCapture(e.pointerId);d.classList.add('drag')});
 d.addEventListener('pointermove',e=>{if(on)put(ox+e.clientX-sx,oy+e.clientY-sy)});
 const end=()=>{if(!on)return;on=false;d.classList.remove('drag');const r=d.getBoundingClientRect();try{localStorage.setItem('dockpos',JSON.stringify({x:r.left,y:r.top}))}catch(e){}};
 d.addEventListener('pointerup',end);d.addEventListener('pointercancel',end);
 d.addEventListener('dblclick',e=>{if(e.target.closest('.it'))return;d.removeAttribute('style');try{localStorage.removeItem('dockpos')}catch(e){}});
 addEventListener('resize',()=>{if(d.style.top){const r=d.getBoundingClientRect();put(r.left,r.top)}})})();

Promise.all([route(),new Promise(r=>setTimeout(r,2400))]).then(()=>$('#loader').classList.add('off'));
